# Старый сабдомен → корень
server {
    listen 80;
    listen [::]:80;
    server_name mailing52.arnolder.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://arnolder.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mailing52.arnolder.ru;

    ssl_certificate /etc/letsencrypt/live/arnolder.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arnolder.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://arnolder.ru$request_uri;
    }
}
