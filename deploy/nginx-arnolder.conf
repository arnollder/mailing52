# HTTP → HTTPS (default_server для arnolder.ru)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arnolder.ru www.arnolder.ru 88.218.171.254 _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~* ^/yandex_[a-f0-9]+\.html$ {
        root /var/www/html;
        default_type text/html;
        charset utf-8;
        access_log off;
    }

    location = /services.yml {
        root /var/www/html;
        default_type application/xml;
        charset utf-8;
        access_log off;
    }

    location = /litcom52.apk {
        root /var/www/html;
        default_type application/vnd.android.package-archive;
        access_log off;
        add_header Cache-Control "no-store";
    }

    location = /litcom-app-config.json {
        root /var/www/html;
        default_type application/json;
        charset utf-8;
        access_log off;
        add_header Cache-Control "no-store";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name arnolder.ru www.arnolder.ru 88.218.171.254 _;

    ssl_certificate /etc/letsencrypt/live/arnolder.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arnolder.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    server_tokens off;

    location ~* ^/yandex_[a-f0-9]+\.html$ {
        root /var/www/html;
        default_type text/html;
        charset utf-8;
        access_log off;
    }

    location = /services.yml {
        root /var/www/html;
        default_type application/xml;
        charset utf-8;
        access_log off;
    }

    location = /executor.png {
        root /var/www/html;
        access_log off;
    }

    location = /litcom52.apk {
        root /var/www/html;
        default_type application/vnd.android.package-archive;
        access_log off;
        add_header Cache-Control "no-store";
    }

    location = /litcom-app-config.json {
        root /var/www/html;
        default_type application/json;
        charset utf-8;
        access_log off;
        add_header Cache-Control "no-store";
    }

    location ^~ /_nuxt/ {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
